# The site is plain static HTML served from the repo root — Jekyll just copies it.
# Keep the research source and repo docs out of the published site.
exclude:
  - README.md
  - company-data/
  - node_modules/
  - tools/
# Serve these as-is (Jekyll would otherwise skip or reprocess them)
include:
  - llms.txt
  - llms-full.txt
  - robots.txt
  - ce6a52e4595af36c505a42611d1857d8.txt   # IndexNow key (see tools/indexnow.js)
